server:
  port: 8080

spring:
  config:
    import: optional:file:./config/application-secrets.yml   # подключаем внешний файл
  main:
    allow-circular-references: true
  datasource:
    url: jdbc:postgresql://localhost:5440/jhrana_db
    # username и password теперь берутся из внешнего файла
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
    # username и password — из внешнего файла

s3:
  endpoint: https://storage.yandexcloud.net
  bucket-name: administratorjhranacloud
  # access-key и secret-key — из внешнего файла

file:
  upload-dir: uploads/photos

app:
  jwt:
    expiration: 86400000
    # secret — из внешнего файла
  admin:
  # username и password — из внешнего файла